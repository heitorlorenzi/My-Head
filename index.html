<!doctype html>
<html lang="pt-br">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">

    <title>Cabeça Girando </title>
   
</head>

<body>

    <!-- Cabeçalho da Página -->
    <header class="py-3 text-center border-bottom bg-dark text-white shadow-sm">
        <h1 class="h3 mb-1 fw-bold">Projeto Cabeça Girando</h1>
        <p class="text-secondary mb-0 small">GitFlow &amp; GitHub Pages &bull; Desenvolvido por <strong>Heitor Lorenzi</strong></p>
    </header>

    <!-- Conteúdo Principal / Card Interativo -->
    <main class="container my-auto py-5 d-flex justify-content-center align-items-center">
        <div class="card-spinning text-center">
            <a href="./readme.html" title="Clique para ver o README">
                <img id="img" src="img/cabeca.jpg" alt="Cabeça Girando" class="mb-4">
            </a>

            <h2 class="h5 fw-bold mb-2">Animação Interativa GSAP</h2>
            <p class="text-secondary small mb-4">Controle a velocidade de rotação da cabeça em tempo real:</p>

            <div class="controls-container d-flex justify-content-center gap-2 flex-wrap">
                <button id="btn-pause" class="btn btn-outline-warning btn-sm px-3">⏸️ Pausar</button>
                <button id="btn-slow" class="btn btn-outline-info btn-sm px-3">🐢 0.5x</button>
                <button id="btn-normal" class="btn btn-outline-light btn-sm px-3">⚡ 1x</button>
                <button id="btn-fast" class="btn btn-outline-danger btn-sm px-3">🚀 3x</button>
            </div>
        </div>
    </main>

    <!-- Rodapé com Links de Contato -->
    <footer class="py-3 border-top border-secondary text-center small text-secondary">
        <div class="container d-flex justify-content-center align-items-center gap-3 flex-wrap">
            <a href="https://github.com/heitorlorenzi" target="_blank" rel="noopener noreferrer" class="text-info text-decoration-none">
                🐙 GitHub: @heitorlorenzi
            </a>
            <span>&bull;</span>
            <a href="./readme.html" class="text-secondary text-decoration-none">
                📖 Documentação Original
            </a>
            <span>&bull;</span>
            <a href="mailto:heitor@exemplo.com" class="text-secondary text-decoration-none">
                ✉️ Contato
            </a>
        </div>
    </footer>





    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.4/gsap.min.js"></script>
    <script src="js/main.js"></script>


</body>

</html>
